<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6f0">
  <meta name="robots" content="noindex, nofollow">
  <title>Our Journey</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Dancing+Script:wght@600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <header class="hero">
    <p class="birthday" id="birthday"></p>
    <h1 id="title">Our Journey</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="countdown" id="countdown" hidden></div>
    <a class="start" href="#line">All aboard <span class="arrow">↓</span></a>
  </header>

  <main class="line" id="line">
    <div class="track" aria-hidden="true"></div>
    <div class="trail" id="trail" aria-hidden="true"></div>
    <div class="train" id="train" aria-hidden="true">
      <svg viewBox="0 0 32 92" xmlns="http://www.w3.org/2000/svg">
        <!-- rear carriage -->
        <rect x="5" y="2" width="22" height="24" rx="6" fill="#fffaf5" stroke="#c9a24a" stroke-width="2"/>
        <path d="M16 18c-4-3-6-5-6-7.2a3 3 0 0 1 6-.8 3 3 0 0 1 6 .8c0 2.2-2 4.2-6 7.2z" fill="#c8566b"/>
        <rect x="14" y="26" width="4" height="5" fill="#6b4f4a"/>
        <!-- front carriage -->
        <rect x="5" y="31" width="22" height="24" rx="6" fill="#fffaf5" stroke="#c9a24a" stroke-width="2"/>
        <path d="M16 47c-4-3-6-5-6-7.2a3 3 0 0 1 6-.8 3 3 0 0 1 6 .8c0 2.2-2 4.2-6 7.2z" fill="#c8566b"/>
        <rect x="14" y="55" width="4" height="5" fill="#6b4f4a"/>
        <!-- engine, nose pointing down the line -->
        <path d="M4 66a6 6 0 0 1 6-6h12a6 6 0 0 1 6 6v12c0 6-5.5 12-12 12S4 84 4 78z" fill="#c8566b"/>
        <rect x="8" y="63" width="16" height="7" rx="2" fill="#f6d9de"/>
        <circle cx="16" cy="79" r="4" fill="#3b2a2a"/>
        <circle cx="16" cy="79" r="1.6" fill="#c9a24a"/>
      </svg>
    </div>
    <ol class="stops" id="stops"></ol>
  </main>

  <footer class="end">
    <p id="footer"></p>
  </footer>

  <div class="celebrate" id="celebrate" aria-hidden="true">
    <div class="cb-card" role="dialog" aria-modal="true" aria-labelledby="cb-title">
      <div class="cb-icon"></div>
      <p class="cb-date"></p>
      <h2 class="cb-title" id="cb-title"></h2>
      <p class="cb-count"></p>
      <p class="cb-text"></p>
      <button class="cb-close" type="button">Continue the journey ↓</button>
    </div>
  </div>

  <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>

  <button class="music" id="music" type="button" aria-label="Play music" aria-pressed="false" hidden>
    <span class="note">♪</span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
  <p class="music-hint" id="music-hint">Tap anywhere for music ♪</p>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">‹</button>
    <img id="lightbox-img" alt="">
    <button class="lb-nav lb-next" type="button" aria-label="Next photo">›</button>
  </div>

  <div class="letter" id="letter" aria-hidden="true">
    <div class="lm-env" aria-hidden="true">
      <div class="lm-back"></div>
      <div class="lm-slip"></div>
      <div class="lm-front"></div>
      <div class="lm-flap"><span class="lm-seal">❤</span></div>
    </div>
    <article class="lm-paper" role="dialog" aria-modal="true" aria-labelledby="letter-title">
      <button class="lm-close" type="button" aria-label="Close letter">✕</button>
      <p class="lm-for" id="letter-title"></p>
      <p class="lm-dear">Dear Pranali,</p>
      <div class="lm-text" id="letter-text"></div>
      <p class="lm-sign">Yours, Manas</p>
    </article>
  </div>

  <script src="journey.js"></script>
  <script src="app.js"></script>
  <script src="music.js"></script>
</body>
</html>
